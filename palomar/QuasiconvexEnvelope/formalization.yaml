version: "v0.4"

project:
  name: "Dacorogna's formula for the quasiconvex envelope, in Lean"
  description: >-
    For a continuous function f on d x m matrices, the quasiconvex envelope (the supremum of the
    quasiconvex functions below f) is the infimum, over the Lipschitz maps phi vanishing outside
    Omega, of the averages over Omega of f(A + D phi), for every nonempty bounded open set Omega
    (Dacorogna's formula). No growth or lower bound of f is assumed: both sides have values in
    [-infinity, infinity).


    Also proved, for this infimum formula: it does not depend on Omega, it is rank-one convex, and,
    if it is finite at one matrix, it is finite everywhere, continuous and quasiconvex (Kinderlehrer
    and Pedregal 1991, Proposition 8.1). Part of a Lean library of the vectorial calculus of
    variations.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.AP", "math.CA"]
  msc2020: ["49J45", "26B25", "49J10", "68V20"]

