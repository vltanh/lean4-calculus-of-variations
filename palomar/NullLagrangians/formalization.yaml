    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/sergioconti/so3-r1c-and-not-qc"
    relationship: "independent"
    note: >-
      Conti, Dolzmann and Dondl (October 2026): a frame-indifferent rank-one convex function on
      R^{3x3} that is not quasiconvex. It has Morrey's quasiconvexity for m x n matrices with smooth
      compactly supported test maps, and the inequality for smooth periodic maps and continuous
      quasiconvex f. Not used: after the proofs that this library had on 22 November 2026, a
      literature search displayed its README, its definitions, docstrings and statements, and a few
      short auxiliary proofs; nothing was taken from it.
  - id: "https://github.com/lcao11/hierarchical_laminates_lean"
    relationship: "independent"
    note: >-
      Cao (October 2026): a minimum of two quadratic forms whose quasiconvex and rank-one convex envelopes differ (d = 32,
      m = 2); in that size, periodic quasiconvex functions below a continuous one are rank-one
      convex; functions convex in each coordinate and locally bounded are locally Lipschitz. Seen (statements and docstrings) in the literature search of
      22 November 2026, after the proofs that this library had then; not used.
  - id: "https://github.com/Robertboy18/PDEAtlas"
    relationship: "independent"
    note: >-
      After Evans (November 2026): null Lagrangians, the divergence form of the minors of every order
      of a C^2 map, their weak continuity in W^{1,q}, and existence for polyconvex energies. It has
      the closest results: the divergence form of minors (here Theorem 8.33 of Dacorogna 2008, inside
      the proof) and null Lagrangians for C^2 maps. It has no quasiconvexity or rank-one convexity,
      and no characterization of quasiaffine functions. Seen (statements and docstrings) in the literature search of 22 November 2026; not used.
  - id: "https://github.com/facebookresearch/atlas-lean"
    relationship: "independent"
    note: "Definitions of rank-one convexity and quasiconvexity for 2 x 2 matrices; not used."

status:
  scope: >-
    Proved, for all d and m: the statements listed under alignment. Not included: the conditions
    (ii') (f of class C^1, with an identity for the gradient) and (iii) (polyaffine) of Dacorogna's
    Theorem 5.20; Theorem 8.35 (ii), for maps in W^{1,p}; quasiaffine functions with values
    +infinity.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

