    author_endorsement: "not-contacted"
  - title: "Quasiconvexity and relaxation of nonconvex problems in the calculus of variations"
    authors:
      - "Bernard Dacorogna"
    id: "doi:10.1016/0022-1236(82)90046-5"
    type: "paper"
    location: "J. Funct. Anal. 46 (1982), 102-118; https://doi.org/10.1016/0022-1236(82)90046-5"
    relationship: "formalizes"
