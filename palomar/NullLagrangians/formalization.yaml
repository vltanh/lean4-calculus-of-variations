fidelity:
  divergences: >-
    Statements. Test maps: Lipschitz maps on R^m that vanish outside Omega, instead of
    W^{1,infinity}_0 (Omega) (Dacorogna 2008) or smooth maps with compact support (Dacorogna 1982).
    For bounded Lipschitz domains the first two classes agree; for a general bounded open set the
    maps here are among those of Dacorogna 2008 (W^{1,infinity} and W^{1,1}_0), possibly not all of
    them. Theorem 8.35 is stated for every bounded set Omega (the source: bounded open). Borel
    measurability and local boundedness, part of the definition of quasiconvexity in the source, are
    stated with the conditions 2 and 3 (a null Lagrangian is assumed Borel and locally bounded).
    Quasiconvexity is tested on the unit cube, which is the same by Dacorogna 2008, Proposition 5.11.
    The minors are indexed by pairs of strictly increasing maps Fin k -> Fin d, Fin k -> Fin m, for all
    k <= min(d, m), including the minor of order 0, the constant 1 (the source: f(0) and the vector
    T(xi) of the minors, with signs); the coefficients are functions of k and of these maps.
    Proofs. They follow Dacorogna 2008: Theorem 5.20 (ii) => (iii') by induction on the number of rows
    and Lemma 5.24, repaired: for n > s + 1 the functions X_beta of (5.47) are not rank-one affine and
    their sum is not g, so the columns are restricted first; the t^2 coefficients displayed on p. 190
    omit terms, so the matrices are chosen with zero columns; that f is of class C^1 is neither
    justified there nor used. Theorem 8.35, (8.44), by the proof of its part (ii) with v affine; the
    divergence identity (8.42) is proved with Leibniz' formula and a sign-reversing involution on
    permutations instead of an induction on the order, with the same cancelling terms. (iii') => (i)
    by Theorem 8.35, the source's second argument (its first one goes through polyconvexity).

