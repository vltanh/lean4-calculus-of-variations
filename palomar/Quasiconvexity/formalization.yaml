version: "v0.4"

project:
  name: "Quasiconvexity and rank-one convexity, in Lean"
  description: >-
    The basic theory of Morrey's quasiconvexity, for integrands f on d x m matrices of every size,
    from the textbooks of Rindler and Dacorogna. A quasiconvex function is rank-one convex.
    Quasiconvexity does not depend on the domain, among the nonempty bounded open sets, and may be
    tested with periodic maps. A rank-one convex function is locally Lipschitz, with a bound by its
    oscillation. A quadratic form is quasiconvex if and only if it is rank-one convex.


    f is Borel and locally bounded, as in the textbooks; for the theorems on rank-one convex
    functions it is an arbitrary function. Test maps are Lipschitz and vanish outside the domain.
    Part of a Lean library of the vectorial calculus of variations.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.AP", "math.CA"]
  msc2020: ["49J45", "26B25", "49J10", "68V20"]

sources:
