      status: "proved"
      note: "Dacorogna's formula for continuous f, every nonempty bounded open set, values in [-infinity, infinity)."
    - source: "Kinderlehrer-Pedregal 1991, Proposition 8.1 (i); Dacorogna 2008, Theorem 6.9"
      lean: "QuasiconvexEnvelopeChallenge.domainInf_eq_of_isBounded"
      module: "QuasiconvexEnvelope.Challenge"
      status: "proved"
      note: "The infimum formula does not depend on the nonempty bounded open set; no condition on the boundary."
    - source: "Kinderlehrer-Pedregal 1991, Proposition 8.1 (ii)"
      lean: "QuasiconvexEnvelopeChallenge.domainInf_le_of_rank_le_one"
      module: "QuasiconvexEnvelope.Challenge"
      status: "proved"
      note: "Rank-one convexity of the infimum formula, with values in EReal."
    - source: "Kinderlehrer-Pedregal 1991, Proposition 8.1 (iii), (iv)"
      lean: "QuasiconvexEnvelopeChallenge.exists_domainInf_eq_coe"
