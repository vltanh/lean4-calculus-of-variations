      module: "NullLagrangians.Challenge"
      status: "proved"
      note: "Minors of every order are null Lagrangians, on every bounded set, for Lipschitz test maps."
    - source: "Dacorogna 2008, Theorem 5.20 (i), (ii), (iii'); Dacorogna 1982, Proposition 4"
      lean: "NullLagrangiansChallenge.rankOneAffine_tfae"
      module: "NullLagrangians.Challenge"
      status: "proved"
      note: "Rank-one affine, quasiaffine, null Lagrangian and affine combination of minors are equivalent."

