fidelity:
  divergences: >-
    Statements. Test maps: Lipschitz maps on R^m that vanish outside Omega, instead of
    W^{1,infinity}_0 (Omega). For bounded Lipschitz domains the classes agree; for a general bounded
    open set the maps here are among those of Dacorogna (W^{1,infinity} and W^{1,1}_0), possibly not
    all of them. Quasiconvexity is tested on the unit cube (Rindler: the unit ball; Dacorogna: every
    bounded open set), which is the same by the independence of the domain. Borel measurability and
    local boundedness, part of the definition of quasiconvexity in both books, are hypotheses; the
    integrability required by the definition here is automatic under them (integrableOn_add_grad).
    Rindler's rank-one convex functions are Borel and locally bounded by definition (p. 111 remarks
    that local boundedness is automatic); here, as in Dacorogna's Theorem 5.3 (iv), no regularity is
    assumed in the two theorems on rank-one convex functions. The independence of the domain and the
    criterion with periodic maps are stated at each matrix A (the books: for all A together), which
    their proofs give. The domains in the independence of the domain are nonempty: Dacorogna's
    Proposition 5.11 does not say so for its first domain, and is false for the empty set. The
    Lipschitz estimate (5.9) is stated for any bound omega of the oscillation on the closed ball.
    Theorem 5.25 (i) is stated for bilinear forms Q and A -> Q(A, A), which are the quadratic
    functions of the source. Matrices are d x m (Rindler: m x d; Dacorogna: N x n).


    Proofs. They follow the sources, with these repairs and additions: the slope bound (5.10) of
    Rindler holds for the difference f(A) - f(B) only when it is nonnegative, so A and B are
    exchanged in the other case; local boundedness of rank-one convex functions is proved (by
    convexity in each entry); the gradient of a Lipschitz map vanishes almost everywhere on its zero
    set (needed for the test maps used here on arbitrary open sets); rotated cubes are treated by an
    orthogonal change of variables and the independence of the domain; the independence of the
    domain passes through the unit cube; in Proposition 5.13 the width of the cut-off layer and the
    frequency are chosen separately; in Theorem 5.25 (i) Plancherel's formula is applied to smooth
    maps and the inequality passes to Lipschitz maps by mollification.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    No human review. An independent AI agent (Claude Opus 5.5), given the Challenge, this file and
    the texts of the sources and not the writers' conclusions, compared every statement with the
    sources and looked for vacuous cases and missing hypotheses. It found no wrong, vacuous or
    altered statement; its findings (missing citations, unrecorded differences, wording) are
    corrected here. Other agents compared the proofs of the library with the sources.

alignment:
  namespace: "QuasiconvexityChallenge"
  statements:
    - source: "Dacorogna 2008, Theorem 5.3 (iv); Rindler 2026, Lemma 5.9 (first assertion)"
      lean: "QuasiconvexityChallenge.rankOneConvex_locallyLipschitz"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "A rank-one convex f: R^{d x m} -> R is locally Lipschitz (Frobenius norm); no regularity of f is assumed."
    - source: "Rindler 2026, proof of Lemma 5.9, (5.9)"
      lean: "QuasiconvexityChallenge.rankOneConvex_abs_sub_le_of_osc"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "Lipschitz constant sqrt(min(d, m)) omega / (3r) on the ball of radius r, omega a bound of the oscillation on the closed ball of radius 6r."
    - source: "Rindler 2026, Proposition 5.6; Dacorogna 2008, Theorem 5.3 (i)"
      lean: "QuasiconvexityChallenge.rankOneConvex_of_quasiconvex"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "Borel, locally bounded, quasiconvex on the unit cube at every matrix implies rank-one convex."
    - source: "Dacorogna 2008, Proposition 5.11; Rindler 2026, Lemma 5.2 (i)"
      lean: "QuasiconvexityChallenge.quasiconvexAtOn_iff_of_isBounded"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "Quasiconvexity at A is the same on all nonempty bounded open sets."
    - source: "Dacorogna 2008, Proposition 5.13"
      lean: "QuasiconvexityChallenge.quasiconvexAtOn_unitCube_iff_periodic"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "Quasiconvexity at A on the unit cube is equivalent to the inequality for Z^m-periodic Lipschitz maps."
    - source: "Dacorogna 2008, Theorem 5.25 (i)"
      lean: "QuasiconvexityChallenge.quadraticForm_quasiconvex_iff"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "A quadratic form is quasiconvex if and only if it is rank-one convex."
    - source: "a check of the definitions"
      lean: "QuasiconvexityChallenge.integrableOn_add_grad"
      module: "Quasiconvexity.Challenge"
      status: "proved"
      note: "The integrability clause in the definition of quasiconvexity holds for Borel, locally bounded f and bounded domains."

acknowledgements: "Lean and Mathlib."
