fidelity:
  divergences: >-
    Statements. Test maps: Lipschitz maps on R^m that vanish outside Omega, instead of
    W^{1,infinity}_0 (Omega) (Kinderlehrer and Pedregal, Dacorogna 2008) or smooth maps with compact
    support in a cube (Dacorogna 1982). For bounded Lipschitz domains the first two classes agree;
    for a general bounded open set the maps here are among those of Dacorogna 2008 (W^{1,infinity}
    and W^{1,1}_0), possibly not all of them. Integrands: f is continuous, as in Kinderlehrer and
    Pedregal, with no growth condition and no quasiconvex minorant; Dacorogna 1982 assumes a <= f <=
    b + c|F|^p, Dacorogna 2008 that f is Borel and locally bounded with a quasiconvex minorant, a
    case that is not covered when f is discontinuous; Müller (Theorem 4.5 (iii)) has every f with
    values in [-infinity, infinity) and domains with null boundary. The infimum of Dacorogna 1982,
    over smooth maps with compact support, is over fewer maps; that it is the same is not stated.
    Values: the envelope and the infimum formula are in EReal, with the value -infinity where there
    is no quasiconvex minorant. Domains: every nonempty bounded open set, without a condition on the
    boundary (the source's argument for the independence of the domain needs null boundaries).
    Quasiconvexity is tested on the unit cube; the minorants are Borel and locally bounded, as in
    the definition of quasiconvexity in Dacorogna 2008. The finite case states continuity and
    quasiconvexity together with rank-one convexity.


    Proofs. They follow Kinderlehrer and Pedregal, Proposition 8.1. The continuity in (iii), and the
    rank-one convexity of quasiconvex functions, which is used for the minorants, are Rindler's
    Lemma 5.9 and Proposition 5.6. Gap fills: the formula itself, which the source does not state;
    the last step of (iii), left to the reader there; in (iv), the approximation of test maps by
    piecewise affine ones, by mollification and Kuhn-Freudenthal interpolation; the independence of
    the domain without null boundaries, as a consequence of the formula. In (ii) rotated cubes are
    treated by an orthogonal change of variables, and the limit is taken before the infimum over the
    test maps on the slabs.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    No human review. An independent AI agent (Claude Opus 5.5), given the Challenge, this file and
    the texts of the sources and not the writers' conclusions, compared every statement with the
    sources and looked for vacuous cases and missing hypotheses. It found no wrong, vacuous or
    altered statement; its findings (missing citations, unrecorded differences, wording) are
    corrected here. Other agents compared the proofs of the library with the sources.

