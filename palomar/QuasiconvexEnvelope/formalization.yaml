    Proved, for all d and m and every continuous f: the statements listed under alignment. Not
    included: the formula for Borel, locally bounded f (Dacorogna 2008, Theorem 6.9; Rindler 2026,
    Proposition 7.1), growth conditions and test maps in W^{1,p}, relaxation theorems.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

