version: "v0.4"

project:
  name: "Null Lagrangians and quasiaffine functions, in Lean"
  description: >-
    Functions f on d x m matrices that are affine along rank-one lines are exactly the affine
    combinations of the minors of the matrix, of all orders, with no regularity assumed. They are
    also exactly the quasiaffine functions (f and -f quasiconvex), and the null Lagrangians: the
    integral of f(A + D phi) over a bounded open set Omega is |Omega| f(A) for every matrix A and every
    Lipschitz map phi that vanishes outside Omega.


    This is the characterization due to Ball (1977), after Ericksen and Edelen, in the form and with
    the proofs of Dacorogna's book (2008, Theorems 5.20 and 8.35). Part of a Lean library of the
    vectorial calculus of variations.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.AP", "math.CA"]
  msc2020: ["49J45", "26B10", "26B25", "15A15", "68V20"]

