        4.2.0 to 4.3.1: a main session and sub-agents (statement writers, provers, independent
        reviewers, a literature search); the number of agents was not tracked for this library
        alone. Lean v4.36.0-rc2, Mathlib v4.36.0-rc2.
      cost:
        wall_time: "about WALL hours from the first to the last commit of the library, 22 November 2026 (git log), with other work in parallel; agent time not tracked"
        spend_usd: "not tracked"
