related_formalizations:
  - id: "https://github.com/sergioconti/so3-r1c-and-not-qc"
    relationship: "independent"
    note: >-
      Conti, Dolzmann and Dondl (arXiv:2610.31886): a frame-indifferent rank-one convex function on
      R^{3x3} that is not quasiconvex. Nothing was taken from it. A literature search of 22 November
      2026 displayed its README, its definitions, docstrings and statements, and a few short
      auxiliary proofs. The proof that a rank-one affine function is a combination of minors is
      older; the proofs about minors of every order and the equivalence are later, and were written
      from Dacorogna's book without opening the code of any other formalization.
  - id: "https://github.com/lcao11/hierarchical_laminates_lean"
    relationship: "independent"
    note: >-
      Cao (October 2026): a minimum of two quadratic forms whose quasiconvex and rank-one convex
      envelopes differ (d = 32, m = 2); in that size, periodic quasiconvex functions below a
      continuous one are rank-one convex; functions convex in each coordinate and locally bounded
      are locally Lipschitz. Some of its statements and docstrings were seen in the same literature
      search; not used.
  - id: "https://github.com/Robertboy18/PDEAtlas"
    relationship: "independent"
    note: >-
      After Evans (November 2026): null Lagrangians, the divergence form of the minors of every
      order of a C^2 map, their weak continuity in W^{1,q}, and existence for polyconvex energies.
      It has the closest results: the divergence form of minors (here Theorem 8.33 of Dacorogna
      2008, inside the proof) and null Lagrangians for C^2 maps. It has no quasiconvexity or
      rank-one convexity, and no characterization of quasiaffine functions. Its statements and
      docstrings were seen in the same literature search, before the proofs of this library about
      minors of every order (AllOrders.lean, Characterization.lean) were written, by another agent
      than the one that wrote them; not used.
  - id: "https://github.com/facebookresearch/atlas-lean"
    relationship: "independent"
    note: "Definitions of rank-one convexity and quasiconvexity for 2 x 2 matrices; not used."

